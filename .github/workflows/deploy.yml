name: Build & Deploy to VPS

on:
  push:
    branches:
      - main
      - feature/deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # ── 1. Checkout source code ───────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Compute lowercase image prefix ─────────────────────────────────────
      - name: Set image prefix
        run: |
          PREFIX="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_PREFIX=$PREFIX" >> $GITHUB_ENV

      # ── 3. Log in to GitHub Container Registry ────────────────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      # ── 4. Build & push backend image ─────────────────────────────────────────
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-backend:latest

      # ── 5. Build & push frontend image ────────────────────────────────────────
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-frontend:latest

      # ── 6. Write .env from BACKEND_ENV_FILE secret ────────────────────────────
      - name: Write .env file
        run: printf '%s' "$BACKEND_ENV_FILE" > /tmp/app.env
        env:
          BACKEND_ENV_FILE: ${{ secrets.BACKEND_ENV_FILE }}

      # ── 7. Copy files to VPS ──────────────────────────────────────────────────
      - name: Copy config files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "docker-compose.prod.yml,/tmp/app.env"
          target: ${{ secrets.VPS_APP_DIR }}

      # ── 8. SSH — install Docker, pull images, restart containers ──────────────
      - name: Setup and deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: IMAGE_PREFIX
          script: |
            set -e
            APP_DIR="${{ secrets.VPS_APP_DIR }}"

            # Install Docker if not present
            if ! command -v docker &>/dev/null; then
              echo "Installing Docker..."
              curl -fsSL https://get.docker.com | sh
              systemctl enable docker
              systemctl start docker
            fi

            # Create app directory and data folder
            mkdir -p "$APP_DIR/data"
            cd "$APP_DIR"

            # Move .env into place (scp puts files in a subdir)
            mv tmp/app.env .env 2>/dev/null || mv app.env .env 2>/dev/null || true

            # Ensure ALLOWED_ORIGINS points to the frontend port
            grep -q "ALLOWED_ORIGINS" .env || echo 'ALLOWED_ORIGINS=["http://138.252.200.244:8015"]' >> .env

            # Log in to GitHub Container Registry
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin

            # Pull latest images and restart
            IMAGE_PREFIX=$IMAGE_PREFIX docker compose -f docker-compose.prod.yml pull
            IMAGE_PREFIX=$IMAGE_PREFIX docker compose -f docker-compose.prod.yml down || true
            IMAGE_PREFIX=$IMAGE_PREFIX docker compose -f docker-compose.prod.yml up -d

            # Cleanup
            docker image prune -f

            echo "Deployment complete."
            docker compose -f docker-compose.prod.yml ps
