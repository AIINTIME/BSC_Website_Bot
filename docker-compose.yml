version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: bsc_backend
    restart: unless-stopped
    ports:
      - "8016:8016"
    env_file:
      - .env
    volumes:
      # Mount data directory for FAQ JSON and other runtime data files
      - ./data:/app/data
    networks:
      - bsc_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: bsc_frontend
    restart: unless-stopped
    ports:
      - "8015:80"
    depends_on:
      - backend
    networks:
      - bsc_network

networks:
  bsc_network:
    driver: bridge
